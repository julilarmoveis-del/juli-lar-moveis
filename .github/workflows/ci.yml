name: Validar e publicar loja

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Gerar build de produção
        run: npm run build

  deploy:
    name: Publicar na Vercel
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_g7oIB0teRPGb5iMKfOMGlgX5
      VERCEL_PROJECT_ID: prj_LyVHyWOseic3fsmL8O4HoY81p5zz
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Obter identidade segura do GitHub
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Trocar identidade por token temporário da Vercel
        shell: bash
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.vercel.com/login/oauth/token" \
            --data "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data "client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD" \
            --data "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            --data "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            --data-urlencode "team_id_or_slug=${VERCEL_ORG_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}")"

          token="$(printf '%s' "$response" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "::error title=Autorização Vercel::A troca OIDC não retornou um token."
            exit 1
          fi

          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Confirmar acesso ao projeto
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" >/dev/null

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Carregar configuração da Vercel
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Gerar build da Vercel
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publicar em produção
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
