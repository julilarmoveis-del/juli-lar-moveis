name: Validar e publicar loja

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Gerar build de produção
        run: npm run build

  deploy:
    name: Publicar na Vercel
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir credenciais da Vercel
        id: credentials
        shell: bash
        run: |
          ready=true
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "::notice title=Vercel não conectada::$variable ainda não está configurada neste repositório. A publicação foi ignorada sem afetar o site."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Confirmar que o projeto é da JuliLar
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          endpoint="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            endpoint="${endpoint}?teamId=${VERCEL_ORG_ID}"
          fi

          project_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "$endpoint")
          project_name=$(printf '%s' "$project_json" | jq -r '.name // empty')

          case "$project_name" in
            julilar-deploy-novo|juli-lar-moveis|julilar-ofertas)
              echo "Projeto confirmado: $project_name"
              ;;
            *)
              echo "::error title=Publicação bloqueada::As credenciais apontam para '$project_name', e não para um projeto JuliLar. Nenhum deploy foi realizado."
              exit 1
              ;;
          esac

      - name: Configurar Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependências
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Carregar configuração da Vercel
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Gerar build da Vercel
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publicar em produção
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
