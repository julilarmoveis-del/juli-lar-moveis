name: Criar novos produtos JuliLar

on:
  push:
    paths:
      - ".github/workflows/create-new-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Criar fotos dos novos produtos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar imagens-base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/julilar-new public/produtos

          download() {
            local url="$1"
            local output="$2"
            echo "Baixando $output"
            curl --fail --location --retry 4 --retry-delay 2               --user-agent "Mozilla/5.0 JuliLarNewProducts/1.0"               "$url" --output "$output"
            test "$(stat -c%s "$output")" -gt 4500
          }

          # Aparador
          download "https://www.saldaodoserjao.com/products/balcao/balcao_aparador_design_industrial_c_02_portas_89_cm_100_mdf_513_1_4cc52fb9b7015e33e33bee25624de968.webp" "/tmp/julilar-new/ap-1.webp"
          download "https://www.saldaodoserjao.com/products/balcao/balcao_aparador_design_industrial_c_02_portas_89_cm_100_mdf_513_2_f359d4db3d1ee0414ec885dc91c7838f.webp" "/tmp/julilar-new/ap-2.webp"
          download "https://www.saldaodoserjao.com/products/balcao/balcao_aparador_design_industrial_c_02_portas_89_cm_100_mdf_513_3_85f135bb85ce0dd9ed70662fcb168a4b.webp" "/tmp/julilar-new/ap-3.webp"
          download "https://www.saldaodoserjao.com/products/balcao/balcao_aparador_design_industrial_89cm_com_02_portas_100_mdf_513_2_e664e3588ef4324daf7af225a2cc00e4.webp" "/tmp/julilar-new/ap-4.webp"

          # Estante
          download "https://www.saldaodoserjao.com/products/estantesala/estante_sala_c_prateleiras_e_2_gavetas_dalla_costa_100_mdf_805_variacao_13153_1_1f45f9344c2d5669a2f03f67d239f941.webp" "/tmp/julilar-new/es-1.webp"
          download "https://www.saldaodoserjao.com/products/estantesala/estante_sala_c_prateleiras_e_2_gavetas_dalla_costa_100_mdf_805_variacao_13153_2_d2ef12e2392df7c3e5f65408307e7467.webp" "/tmp/julilar-new/es-2.webp"
          download "https://www.saldaodoserjao.com/products/estantesala/estante_sala_c_prateleiras_e_2_gavetas_dalla_costa_100_mdf_805_variacao_13153_3_726efc00b8c2e0ab2df3ee4572c578ee.webp" "/tmp/julilar-new/es-3.webp"
          download "https://www.saldaodoserjao.com/products/estantesala/estante_sala_c_prateleiras_e_2_gavetas_dalla_costa_100_mdf_805_variacao_13153_4_bdf0babbf7357ed4d71be373a2b05305.webp" "/tmp/julilar-new/es-4.webp"

          # Cristaleira
          download "https://www.saldaodoserjao.com/products/cristaleira/cristaleira_retro_mdf_com_led_porta_em_vidro_e_4_prateleiras_1447_variacao_2209_1_2a4b207908099d03ab89418272a028a3.webp" "/tmp/julilar-new/cr-1.webp"
          download "https://www.saldaodoserjao.com/products/cristaleira/cristaleira_retro_mdf_com_led_porta_em_vidro_e_4_prateleiras_1447_variacao_2209_5_4676849377727ec34967b0bb23c66085.webp" "/tmp/julilar-new/cr-2.webp"
          download "https://www.saldaodoserjao.com/products/cristaleira/cristaleira_retro_mdf_com_led_porta_em_vidro_e_4_prateleiras_1447_variacao_2209_3_3057c7155416dd91c16ac17a211a1720.webp" "/tmp/julilar-new/cr-3.webp"

      - name: Padronizar fotos no estilo JuliLar
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow

          cat > /tmp/new_products.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance, ImageOps
          from pathlib import Path

          SRC = Path("/tmp/julilar-new")
          OUT = Path("public/produtos")
          W = H = 1200

          SAND = "#F8ECE1"
          SAND_DARK = "#F2DDC8"
          WHITE = "#FFFEFC"
          INK = "#141F2D"
          MUTED = "#8A7F75"
          BRAND = "#FAAA6E"
          BRAND_DARK = "#B47A4F"

          SANS = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          SANS_B = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          SERIF_B = "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"

          def font(path, size):
              return ImageFont.truetype(path, size)

          def cover(img, size):
              return ImageOps.fit(img.convert("RGB"), size, method=Image.Resampling.LANCZOS, centering=(0.5,0.5))

          def mask(size, radius):
              m = Image.new("L", size, 0)
              d = ImageDraw.Draw(m)
              d.rounded_rectangle((0,0,size[0],size[1]), radius=radius, fill=255)
              return m

          def paste_rounded(base, img, box, radius=30):
              x,y,w,h = box
              base.paste(img.resize((w,h), Image.Resampling.LANCZOS), (x,y), mask((w,h), radius))

          def shadow(base, box, radius=34):
              x0,y0,x1,y1=box
              s=Image.new("RGBA",base.size,(0,0,0,0))
              d=ImageDraw.Draw(s)
              d.rounded_rectangle((x0+8,y0+12,x1+8,y1+12), radius=radius, fill=(20,31,45,25))
              s=s.filter(ImageFilter.GaussianBlur(18))
              return Image.alpha_composite(base.convert("RGBA"),s).convert("RGB")

          def grade(img):
              img=ImageEnhance.Contrast(img).enhance(1.03)
              img=ImageEnhance.Color(img).enhance(0.96)
              return img

          def make_plain(src, out):
              img=grade(Image.open(src).convert("RGB"))
              c=Image.new("RGB",(W,H),SAND)
              c=shadow(c,(48,48,1152,1152),38)
              ph=cover(img,(1080,1080))
              paste_rounded(c,ph,(60,60,1080,1080),30)
              c.save(out,"WEBP",quality=89,method=6)

          def wrap(draw,text,f,maxw):
              words=text.split()
              lines=[]; cur=""
              for w in words:
                  t=w if not cur else cur+" "+w
                  if draw.textbbox((0,0),t,font=f)[2] <= maxw:
                      cur=t
                  else:
                      lines.append(cur); cur=w
              if cur: lines.append(cur)
              return lines

          def make_info(src,out,title,subtitle,items,dimensions):
              img=grade(Image.open(src).convert("RGB"))
              c=Image.new("RGB",(W,H),SAND)
              d=ImageDraw.Draw(c)

              d.rounded_rectangle((44,44,1156,1156),radius=38,fill=WHITE)
              # foto grande à direita
              photo=cover(img,(660,990))
              paste_rounded(c,photo,(470,90,660,990),30)
              d=ImageDraw.Draw(c)

              d.rounded_rectangle((72,72,282,118),radius=23,fill=INK)
              d.text((94,83),"LINHA NIVA",font=font(SANS_B,19),fill="#FFFFFF")

              tf=font(SERIF_B,50)
              y=160
              for line in wrap(d,title,tf,330):
                  d.text((72,y),line,font=tf,fill=INK); y+=58
              d.line((74,y+12,160,y+12),fill=BRAND,width=5)
              y+=52
              sf=font(SANS,23)
              for line in wrap(d,subtitle,sf,330):
                  d.text((72,y),line,font=sf,fill=MUTED); y+=34
              y+=28

              bf=font(SANS,22)
              for item in items:
                  d.ellipse((74,y+7,87,y+20),fill=BRAND_DARK)
                  for line in wrap(d,item,bf,285):
                      d.text((102,y),line,font=bf,fill=INK); y+=30
                  y+=23

              d.rounded_rectangle((72,975,425,1085),radius=25,fill=SAND)
              d.text((96,995),"MEDIDAS",font=font(SANS_B,16),fill=BRAND_DARK)
              d.text((96,1027),dimensions,font=font(SANS_B,24),fill=INK)
              d.text((96,1062),"L × A × P",font=font(SANS,14),fill=MUTED)

              d.text((72,1110),"JULILAR OFERTAS",font=font(SANS_B,16),fill=BRAND_DARK)
              c.save(out,"WEBP",quality=90,method=6)

          # Aparador
          for i in range(1,5):
              make_plain(SRC/f"ap-{i}.webp",OUT/f"aparador-niva-produto-0{i}.webp")
          make_info(
              SRC/"ap-1.webp",
              OUT/"aparador-niva-destaques.webp",
              "Apoio elegante para vários ambientes.",
              "Funcional como aparador, buffet ou cantinho do café.",
              ["2 portas com fechamento suave","estrutura 100% MDF","tampo amplo para decoração e apoio"],
              "89,5 × 73 × 38 cm",
          )

          # Estante
          for i in range(1,5):
              make_plain(SRC/f"es-{i}.webp",OUT/f"estante-niva-produto-0{i}.webp")
          make_info(
              SRC/"es-1.webp",
              OUT/"estante-niva-destaques.webp",
              "Organização vertical com presença leve.",
              "Prateleiras abertas e gavetas para combinar exposição e organização.",
              ["3 prateleiras para livros e decoração","2 gavetas com corrediças telescópicas","estrutura 100% MDF"],
              "73 × 185 × 32 cm",
          )

          # Cristaleira
          for i in range(1,4):
              make_plain(SRC/f"cr-{i}.webp",OUT/f"cristaleira-niva-produto-0{i}.webp")
          # quarta imagem = segunda foto com enquadramento alternativo, mantendo o produto real
          img=grade(Image.open(SRC/"cr-1.webp").convert("RGB"))
          alt=ImageOps.fit(img,(1200,1200),method=Image.Resampling.LANCZOS,centering=(0.58,0.48))
          c=Image.new("RGB",(1200,1200),SAND)
          c=shadow(c,(48,48,1152,1152),38)
          paste_rounded(c,alt,(60,60,1080,1080),30)
          c.save(OUT/"cristaleira-niva-produto-04.webp","WEBP",quality=89,method=6)
          make_info(
              SRC/"cr-1.webp",
              OUT/"cristaleira-niva-destaques.webp",
              "Exposição elegante com luz integrada.",
              "Vidro, espelho e iluminação para valorizar suas peças favoritas.",
              ["LED integrado","porta de vidro e fundo espelhado","4 prateleiras em vidro"],
              "53 × 180 × 35 cm",
          )
          PY

          python3 /tmp/new_products.py

          file public/produtos/aparador-niva-produto-01.webp
          file public/produtos/estante-niva-produto-01.webp
          file public/produtos/cristaleira-niva-produto-01.webp

      - name: Publicar imagens no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JuliLar Automation"
          git config user.email "julilarmoveis@gmail.com"
          git add public/produtos

          if git diff --cached --quiet; then
            echo "As imagens já estão publicadas."
            exit 0
          fi

          git commit -m "feat: criar fotos dos novos produtos JuliLar"
          git push
